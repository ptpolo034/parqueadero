# Estilo común (claro y oscuro) de Parqueadero, sobre FlatLaf.

@accentColor=#2563EB

# Formas redondeadas y foco discreto
Component.arc=12
Button.arc=12
CheckBox.arc=6
TextComponent.arc=12
Component.focusWidth=1
Component.innerFocusWidth=0
Component.arrowType=chevron

# Botones y campos con aire
Button.margin=7,18,7,18
TextField.margin=5,10,5,10
PasswordField.margin=5,10,5,10
ComboBox.padding=5,10,5,6
Spinner.padding=5,10,5,6
Button.minimumWidth=72

# Barras de desplazamiento finas y redondas
ScrollBar.width=12
ScrollBar.thumbArc=999
ScrollBar.thumbInsets=2,2,2,2
ScrollBar.trackArc=999
ScrollBar.trackInsets=2,2,2,2
ScrollBar.showButtons=false
ScrollPane.smoothScrolling=true

# Tablas limpias: filas altas, solo línea horizontal sutil
Table.rowHeight=36
Table.intercellSpacing=0,1
Table.showHorizontalLines=true
Table.showVerticalLines=false
Table.cellMargins=2,8,2,8
Table.selectionInactiveBackground=
TableHeader.height=40
TableHeader.cellMargins=2,8,2,8
TableHeader.showTrailingVerticalLine=false
TableHeader.separatorColor=#00000000
TableHeader.font=$semibold.font

# Listas
List.selectionArc=10
List.cellMargins=4,10,4,10

# Pestañas y separadores
Separator.stripeWidth=1
TitledBorder.font=$semibold.font

# Tooltips
ToolTip.border=6,10,6,10
ToolTip.arc=10

# Cuadros de diálogo y menús
OptionPane.buttonMinimumWidth=96
OptionPane.messageAreaBorder=14,14,6,14
PopupMenu.borderCornerRadius=10
MenuItem.selectionArc=8
